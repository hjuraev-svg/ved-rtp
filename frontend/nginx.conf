server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 32m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # SPA: every unknown path falls back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must never be cached: it is the only file that names the
    # current hashed bundle. Cache it and browsers keep running the previous
    # build after a deploy until the user clears their cache by hand.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires -1;
    }

    # Asset filenames are content-hashed, so they are safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /ws {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /docs   { proxy_pass http://api:8000; proxy_set_header Host $host; }
    location /openapi.json { proxy_pass http://api:8000; proxy_set_header Host $host; }
}
